name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel outdated runs when new commits are pushed to the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are for local development only; skip installing them in CI.
      LEFTHOOK: 0

    steps:
      # Actions are pinned to full commit SHAs (supply-chain security); the tag is noted for humans.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads the browser matching the installed @playwright/test version, plus OS libraries.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds the app and starts the production server (see webServer in playwright.config.ts).
      - name: Run E2E tests
        run: pnpm test:e2e

      # On failure, keep the HTML report incl. traces so the failing run can be inspected.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds exactly the image that gets deployed, so a broken Dockerfile fails the PR.
      - name: Build image
        run: docker build --tag app:ci .

      # Starts the container and checks real responses: German home, English home, HTTP 404.
      - name: Smoke test
        run: |
          docker run --detach --name app --publish 3000:3000 app:ci
          for _ in $(seq 1 30); do
            curl --silent --output /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:3000/ | grep --quiet '<html lang="de"'
          curl --fail --silent --show-error http://localhost:3000/en | grep --quiet '<html lang="en"'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/does-not-exist)
          test "$status" = 404

      - name: Show container logs
        if: failure()
        run: docker logs app
