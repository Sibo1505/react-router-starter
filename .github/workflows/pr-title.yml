name: PR title

# With squash merging, the PR title becomes the commit message on main,
# so it has to follow Conventional Commits just like local commits (see commitlint).
on:
  # pull_request_target also works for PRs from forks. This is safe here because
  # the job never checks out or runs code from the PR, it only reads the title.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same types as @commitlint/config-conventional.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Subject must start lowercase, e.g. "add vitest setup", not "Add vitest setup".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a lowercase letter.
