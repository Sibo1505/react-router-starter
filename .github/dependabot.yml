# Keeps dependencies and GitHub Actions up to date with weekly, grouped pull requests.
# Every update PR runs through the full CI, so broken updates cannot be merged.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor/patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Exact-pinned on purpose (see package.json); update these deliberately.
      - dependency-name: "@playwright/mcp"
      # Node type definitions must match the Node version we run (.nvmrc, Dockerfile).
      # Major bumps happen together with a deliberate Node upgrade, not automatically.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
